<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>F1 Predict · who wins the next race</title>
<meta name="description" content="Every driver's optimal lap and a predicted finishing order, updated after every practice session and qualifying.">
<meta name="theme-color" content="#0B0C10">
<meta property="og:title" content="F1 Predict: who wins the next race">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root { --bg: #0B0C10; --panel: #14161D; --line: #242733; --ink: #F2F3F5; --muted: #8A8F9E; --red: #E10600; --green: #22C55E; --purple: #A855F7; --yellow: #FACC15; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.4 'Titillium Web', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
header { display: flex; align-items: center; gap: 14px; padding: 12px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; position: sticky; top: 0; background: var(--bg); z-index: 5; }
.logo { font-weight: 900; font-size: 22px; letter-spacing: .02em; display: flex; align-items: center; gap: 8px; color: inherit; text-decoration: none; }
.logo i { width: 10px; height: 22px; background: var(--yellow); transform: skewX(-18deg); display: inline-block; }
.ext { margin-left: auto; color: var(--muted); font-weight: 700; text-decoration: none; font-size: 14px; }
.ext:hover { color: var(--ink); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs a { color: var(--muted); text-decoration: none; font-weight: 700; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line); }
.tabs a.on { color: var(--ink); background: var(--red); border-color: var(--red); }
main { max-width: 980px; margin: 0 auto; padding: 18px 16px 40px; }
h1 { font: 900 30px/1.05 'Titillium Web'; margin: 0 0 4px; }
.sub { color: var(--muted); font-weight: 600; margin-bottom: 14px; }
.stages { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.stages button { font: 700 14px 'Titillium Web'; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; cursor: pointer; }
.stages button.on { color: #000; background: var(--yellow); border-color: var(--yellow); }
.how { color: var(--muted); font-size: 13px; margin: -4px 0 14px; }
.how b { color: var(--ink); }
.row { display: grid; grid-template-columns: 44px 26px 1fr 110px 92px 100px 70px; align-items: center; gap: 8px; padding: 9px 10px; border-bottom: 1px solid var(--line); }
.row.head { color: var(--muted); font: 700 11px 'Titillium Web'; letter-spacing: .06em; text-transform: uppercase; border-bottom: 1px solid var(--line); }
.pos { font: 900 20px 'Titillium Web'; }
.mv { font: 700 12px 'JetBrains Mono'; text-align: center; }
.mv.up { color: var(--green); } .mv.dn { color: var(--red); } .mv.eq { color: #4A4F60; }
.drv { display: flex; align-items: center; gap: 10px; min-width: 0; }
.drv b { width: 5px; height: 26px; border-radius: 3px; flex: none; }
.drv .c { font: 900 17px 'Titillium Web'; }
.drv .t { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.num { font: 500 13px 'JetBrains Mono'; text-align: right; }
.num.p { color: var(--purple); font-weight: 700; }
.num.y { color: var(--yellow); }
.num.m { color: var(--muted); }
.row.top3 .pos { color: var(--yellow); }
footer { color: var(--muted); font-size: 12px; text-align: center; padding: 20px; }
footer a { color: inherit; }
@media (max-width: 700px) {
  .row { grid-template-columns: 34px 22px 1fr 88px 64px; gap: 6px; }
  .row > :nth-child(6), .row > :nth-child(7) { display: none; }
  h1 { font-size: 24px; }
}
</style>
</head>
<body>
<header>
  <a class="logo" href="./"><i></i>F1 PREDICT</a>
  <a class="ext" href="https://rajmans123-netizen.github.io/pitwall/">Replays &amp; season timing ↗</a>
</header>
<main>
  <h1 id="title">Race prediction</h1>
  <div class="sub" id="sub"></div>
  <div class="stages" id="stages"></div>
  <div class="how" id="how"></div>
  <div class="row head"><div>Pos</div><div></div><div>Driver</div><div style="text-align:right">Optimal lap</div><div style="text-align:right">Left on table</div><div style="text-align:right">Long-run pace</div><div style="text-align:right">Form</div></div>
  <div id="rows"></div>
</main>
<footer>Optimal lap = best sector 1 + best sector 2 + best sector 3 · Data: <a href="https://openf1.org">OpenF1</a> (unofficial, not associated with Formula 1) · built with Claude by <a href="https://instagram.com/raj_triess">@raj_triess</a></footer>
<script type="module" src="predict.js"></script>
</body>
</html>
